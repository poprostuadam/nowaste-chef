# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        # Instalujemy zależności z requirements.txt (pip pominie pywinpty dzięki zmianie powyżej)
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # KLUCZOWE: Instalujemy Twój projekt w trybie edytowalnym (jak robiliśmy lokalnie)
        pip install -e .
    - name: Lint with flake8
      run: |
        # Dodajemy wykluczenie venv
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv
    - name: Test with pytest
      run: |
        # Uruchamiamy testy, ignorując venv
        pytest --ignore=venv
